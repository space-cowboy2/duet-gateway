name: check
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ripgrep (files_search uses it)
        run: choco install ripgrep -y --no-progress
      - run: npm ci
      - run: npm run check

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ripgrep (files_search uses it)
        run: brew install ripgrep
      - run: npm ci
      - run: npm run check
      - run: bash -n setup-agent-mac.sh && bash -n gateway-launchd.sh

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check:sessions
      - run: node doctorcheck.mjs
